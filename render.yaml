services:
  - type: web
    name: nimblers
    runtime: node
    plan: free
    # --include=dev is required here: NODE_ENV=production (set below, for
    # the running server) also applies during the build step on Render,
    # and `npm ci` skips devDependencies under NODE_ENV=production by
    # default — which is exactly where TypeScript, Vite, and the React
    # type declarations this build actually needs live.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's free tier has no cron-job option, so the expiry sweep runs
      # as an in-process interval instead — see server/index.ts.
      - key: ENABLE_INPROCESS_SWEEP
        value: "true"
      # Secrets — set these manually in the Render dashboard (Environment
      # tab) after the first deploy. Never commit real values; see
      # .env.example for what each one is.
      - key: ESCROW_PRIVATE_KEY
        sync: false
      - key: NIMIQ_RPC_URL
        sync: false
      - key: NIMIQ_RPC_USERNAME
        sync: false
      - key: NIMIQ_RPC_PASSWORD
        sync: false
