# Reverse proxy + static file serving for NIMblers.
# Installed to /etc/nginx/sites-available/nimblers by deploy/setup.sh.
#
# Mirrors vite.config.ts's dev proxy: everything under /api/ goes to the
# Node API process, everything else is the built frontend in dist/.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /home/ubuntu/NIMblers/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: any non-file route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
